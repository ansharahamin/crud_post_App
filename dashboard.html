<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container-fluid bodybg">

    <nav class="myNav mb-3">
      <div class="container-fluid">
        <img class="logo" src="./images/s-latter-logo_795228-18-removebg-preview.png" alt="" width="42" height="42">
        <a class="navbar-brand">Post App</a>
        <div role="search" class="d-flex">
          <input id="searchValue" class="form-control" type="search" placeholder="Search posts, people…" aria-label="Search" />
          <button onclick="searchPosts()" class="btn btn-secondary">Search</button>
        </div>
        <button class="btn" id="userInfo" onclick="userInfo()"></button>
        <div class="modal fade" id="userInfoBox" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
 
</div>
      </div>
    </nav>

    <!-- postBox is hidden by default; app.js shows it after verifying session -->
    <div class="d-none" id="postBox">
      <!-- Hidden input to carry the logged-in user's name for post() function -->
      <input type="hidden" id="userName" value="">

      <div class="card postInput">
        <div class="m-3">
          <div class="mb-3">
            <label for="title" class="form-label fw-bold">Title</label>
            <input type="text" class="form-control boxShadow" id="title" aria-describedby="emailHelp"
              placeholder="What's this entry about?">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label fw-bold">Description</label>
            <textarea class="form-control boxShadow" id="description" rows="3"
              placeholder="Write your entry…"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label fw-bold">Background</label>
            <div class="img d-flex justify-content-around gap-2 flex-wrap">
              <img class="bgImg imgBorder" onclick="clickAbleImg()"
                src="https://wallpapers.com/images/hd/explosion-glitter-background-flash-8qvrw7mcdhlbep78.jpg" alt="">
              <img class="bgImg imgBorder" onclick="clickAbleImg()" src="./images/3.jpg" alt="">
              <img class="bgImg imgBorder" onclick="clickAbleImg()" src="./images/2.jpg" alt="">
              <img class="bgImg imgBorder" onclick="clickAbleImg()" src="./images/4.jpg" alt="">
              <img class="bgImg imgBorder" onclick="clickAbleImg()"
                src="https://i.pinimg.com/736x/09/d5/fa/09d5fad0af9aa27e5da9883fbc1d4f4d.jpg" alt="">
                 <label class="bgImg upload-thumb" for="img_upload" id="uploadLabel" title="Upload your own image">
    <svg id="uploadIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"></path>
      <path d="M7 8l5-5 5 5"></path>
      <path d="M5 21h14"></path>
    </svg>
    <input class="d-none" type="file" id="img_upload" accept="image/*" onchange="handleUploadPreview(event)">
  </label>
            </div>
          </div>

          <button type="button" onclick="post()" class="btn MyBtn postBtn">Post</button>
        </div>
      </div>

      <div id="posts"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
